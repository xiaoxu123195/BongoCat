name: Sync Github Repos To Gitee
# Fork note: this is the upstream author's Gitee mirror job (needs their
# secrets). Manual-only so it never auto-fails on the fork.
on:
  workflow_dispatch:

jobs:
  repo-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Github Repos To Gitee
        uses: Yikun/hub-mirror-action@master
        with:
          src: github/ayangweb
          dst: gitee/ayangweb
          dst_key: ${{ secrets.GITEE_PRIVATE_KEY }}
          dst_token: ${{ secrets.GITEE_TOKEN }}
          static_list: BongoCat
          force_update: true
